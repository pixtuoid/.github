version: 2
updates:
  - package-ecosystem: github-actions
    # `/` alone scans only workflows; `/.github/actions/*`, never
    # `.../action.yml`, adds the composites (dependabot-core#6704).
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
