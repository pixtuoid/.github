version: 2
updates:
  - package-ecosystem: github-actions
    # `/` alone scans only workflows; `/.github/actions/*`, never
    # `.../action.yml`, adds the composites (dependabot-core#6704).
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # `actions/*` floats on a major (`@v7`): patch/minor updates already
      # arrive without a PR, and Dependabot reads `@v7` as "version 7" and,
      # filtered by the cooldown below, would rewrite the self-updating ref into
      # an exact pin a week OLD, a downgrade. Only majors need a human. Every
      # action outside the namespaces .github/zizmor.yml relaxes is SHA-pinned,
      # so each of its updates arrives as a PR.
      - dependency-name: "actions/*"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor"]
    cooldown:
      default-days: 7
