name: 'Org rules'
description: "Fails unless the repo's agent guide carries org-rules.md verbatim between its org-rules markers"

inputs:
  file:
    description: "The agent guide to check, from the caller repo's root"
    required: false
    default: 'AGENTS.md'

runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        FILE: ${{ inputs.file }}
        RULES: ${{ github.action_path }}/org-rules.md
      run: |
        # One copy per repo, in its own agent guide, since an agent reads only the guide in front of
        # it; the markers bound the copy so the repo's own rules can sit around it.
        begin='<!-- org-rules:begin -->'
        end='<!-- org-rules:end -->'
        if [[ ! -f "$FILE" ]]; then
          echo "::error::org-rules: $FILE not found"
          exit 1
        fi
        begins="$(grep -c -x -F -e "$begin" "$FILE" || true)"
        ends="$(grep -c -x -F -e "$end" "$FILE" || true)"
        if [[ "$begins" != 1 || "$ends" != 1 ]]; then
          echo "::error file=$FILE::org-rules: needs exactly one '$begin' line and one '$end' line (found $begins and $ends)"
          exit 1
        fi
        copy="$(awk -v b="$begin" -v e="$end" '$0 == e { inside = 0 } inside { print } $0 == b { inside = 1 }' "$FILE")"
        if [[ -z "$copy" ]]; then
          echo "::error file=$FILE::org-rules: '$end' comes before '$begin', or nothing sits between them"
          exit 1
        fi
        if ! diff -u --label "pixtuoid/.github org-rules.md" --label "$FILE" "$RULES" <(printf '%s\n' "$copy"); then
          echo "::error file=$FILE::org-rules: the copy between the markers differs from pixtuoid/.github's .github/actions/org-rules/org-rules.md; copy that file between them verbatim"
          exit 1
        fi
