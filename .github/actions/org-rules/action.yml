name: 'Org rules'
description: "Fails unless the repo's agent guide carries org-rules.md verbatim between its org-rules markers, and the repo's config references or agrees with the org's shared config in each way the shared-config step's checks name"

inputs:
  file:
    description: "The agent guide to check, from the caller repo's root"
    required: false
    default: 'AGENTS.md'

runs:
  using: 'composite'
  steps:
    - name: guide
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        RULES: ${{ github.action_path }}/org-rules.md
      run: |
        # One copy per repo, in its own agent guide, since an agent reads only the guide in front of
        # it; the markers bound the copy so the repo's own rules can sit around it.
        begin='<!-- org-rules:begin -->'
        end='<!-- org-rules:end -->'
        if [[ ! -f "$FILE" ]]; then
          echo "::error::org-rules: $FILE not found"
          exit 1
        fi
        begins="$(grep -c -x -F -e "$begin" "$FILE" || true)"
        ends="$(grep -c -x -F -e "$end" "$FILE" || true)"
        if [[ "$begins" != 1 || "$ends" != 1 ]]; then
          echo "::error file=$FILE::org-rules: needs exactly one '$begin' line and one '$end' line (found $begins and $ends)"
          exit 1
        fi
        # Read straight from awk, never through $(...), which would drop trailing blank lines.
        between() { awk -v b="$begin" -v e="$end" '$0 == e { inside = 0 } inside { print } $0 == b { inside = 1 }' "$FILE"; }
        if [[ -z "$(between)" ]]; then
          echo "::error file=$FILE::org-rules: '$end' comes before '$begin', or nothing sits between them"
          exit 1
        fi
        if ! diff -u --label "pixtuoid/.github org-rules.md" --label "$FILE" "$RULES" <(between); then
          echo "::error file=$FILE::org-rules: the copy between the markers differs from pixtuoid/.github's .github/actions/org-rules/org-rules.md; copy that file between them verbatim"
          exit 1
        fi
    - name: shared-config
      shell: bash
      env:
        # The pixtuoid/.github checkout this action runs from.
        SOURCE: ${{ github.action_path }}/../../..
        REPO: ${{ github.repository }}
        # A repo adds its own marketplaces and plugins beside the org's.
        PLUGINS: >-
          $src[0] as $want
          | (.extraKnownMarketplaces // {}) as $markets | (.enabledPlugins // {}) as $plugins
          | ($want.extraKnownMarketplaces | to_entries | all(.value == $markets[.key]))
            and ($want.enabledPlugins | to_entries | all(.value == $plugins[.key]))
        # A repo's own condition list, in a rule or its defaults, replaces the
        # org's whole (docs.mergify.com/configuration/sharing).
        CONDITIONS: >-
          all(.defaults.queue_rule?, .queue_rules[]? | values | to_entries[]
              | select(.key == "merge_conditions" or .key == "queue_conditions");
            .value as $own | all($org[.key][]; IN($own[])))
        # release-plz's default (release-plz.dev/docs/config).
        RELEASE_PLZ_PREFIX: release-plz-
      run: |
        set -euo pipefail
        status=0
        drift() {
          echo "::error file=$1::org-rules: $2"
          status=1
        }
        # The caller only starts the shared review.
        caller=.github/workflows/review.yml
        if ! diff -u --label "pixtuoid/.github $caller" --label "$caller" "$SOURCE/$caller" "$caller"; then
          drift "$caller" "differs from pixtuoid/.github's; copy that file verbatim"
        fi
        # Mergify resolves `extends` in the caller's org, and the source's own
        # config cannot extend (docs.mergify.com/configuration/sharing).
        if [[ "${REPO#*/}" != .github && "$(yq -r '.extends' .mergify.yml 2>/dev/null)" != .github ]]; then
          drift .mergify.yml "needs 'extends: .github', the org's queue, and only the repo's own rules beside it"
        fi
        if [[ ! -f .mergify.yml ]]; then
          drift .mergify.yml "not found: it holds the repo's queue config"
        elif ! yq -o=json . .mergify.yml |
          jq -e --argjson org "$(yq -o=json '.defaults.queue_rule' "$SOURCE/.mergify.yml")" "$CONDITIONS" >/dev/null; then
          drift .mergify.yml "a merge_conditions or queue_conditions list here replaces the org's, so it must keep each entry pixtuoid/.github's defaults.queue_rule lists for that key"
        fi
        # The org's queue keeps a release PR out by its branch prefix. These are
        # release-plz's default paths (release-plz.dev/docs/config); a file its
        # action's `config` input names isn't read.
        for config in release-plz.toml .release-plz.toml .config/release-plz.toml; do
          [[ -f "$config" ]] || continue
          prefix="$(yq -p toml -o=json -r '.workspace.pr_branch_prefix // strenv(RELEASE_PLZ_PREFIX)' "$config")"
          kept_out="$(yq -r '.defaults.queue_rule.queue_conditions[] | select(tag == "!!str" and test("^-head ~= \\^")) | sub("^-head ~= \\^"; "")' "$SOURCE/.mergify.yml")"
          if [[ "$prefix" != "$kept_out" ]]; then
            drift "$config" "its PR branch prefix '$prefix' is not '$kept_out', the one pixtuoid/.github's .mergify.yml keeps out of the queue"
          fi
        done
        if ! jq -e --slurpfile src "$SOURCE/.claude/settings.json" "$PLUGINS" .claude/settings.json >/dev/null; then
          drift .claude/settings.json "needs pixtuoid/.github's extraKnownMarketplaces and enabledPlugins entries as that repo's .claude/settings.json has them"
        fi
        # A repo's own file replaces the central one whole
        # (docs.coderabbit.ai/configuration/central-configuration).
        for own in .coderabbit.yaml .coderabbit.config.ts; do
          [[ ! -e "$own" ]] || drift "$own" "overrides pixtuoid/coderabbit's central config; delete it"
        done
        exit "$status"
