name: Upload coverage to Codecov
description: Require a generated report and upload it (advisory)

inputs:
  file:
    description: Repository-relative report path
    required: true
  flag:
    description: Codecov flag for this report
    required: true

runs:
  using: composite
  steps:
    - name: Require a generated report
      shell: bash
      env:
        REPORT_FILE: ${{ inputs.file }}
      run: |
        set -euo pipefail
        if [[ ! -s "$REPORT_FILE" ]]; then
          echo "::error title=Missing generated report::$REPORT_FILE is missing or empty"
          exit 1
        fi
        echo "$REPORT_FILE=$(wc -c < "$REPORT_FILE")B"

    - name: Upload report
      continue-on-error: true
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ${{ inputs.file }}
        flags: ${{ inputs.flag }}
        report_type: coverage
        disable_search: true
        plugins: noop
        fail_ci_if_error: true
        use_oidc: true
