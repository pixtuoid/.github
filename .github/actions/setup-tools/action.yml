name: 'Setup Tools'
description: "Installs the given tools of the caller's mise.toml, and only those, through mise"

inputs:
  tools:
    # Spaces, not mise's commas, since the cache key below carries the list
    # and actions/cache refuses a key with a comma (jdx/mise-action@f5be966,
    # dist/index.js:83048).
    description: 'Space-separated mise.toml [tools] keys'
    required: true

runs:
  using: 'composite'
  steps:
    # mise then uses only these tools, in this step and the job's later ones
    # (mise.jdx.dev/configuration/settings.html, enable_tools), so an unlisted
    # one is never resolved and a versions-host outage cannot burn the job
    # token's API budget.
    - shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: | # zizmor: ignore[github-env] the callers' `tools:` literals, never event data
        set -euo pipefail
        if [[ -z "$TOOLS" ]]; then
          echo "::error::setup-tools: no tools given; an empty allowlist enables no tool, and the job would run the runner's own"
          exit 1
        fi
        echo "MISE_ENABLE_TOOLS=${TOOLS// /,}" >>"$GITHUB_ENV"
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        # The action puts each tool's own directory on PATH (src/index.ts,
        # exportMisePath), and a shim errors outside the checkout, where no
        # mise.toml names its version.
        add_shims_to_path: false
        # A GitHub Releases outage fails a fresh install, never a cache hit
        # (pixtuoid/pixtuoid#2193). The default key leaves out
        # MISE_ENABLE_TOOLS (the action's README, "Install a subset of
        # configured tools").
        cache_key: '{{default}}-${{ inputs.tools }}'
        # Every ref restores main's copy (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching),
        # so a save from another ref only evicts main's entries.
        cache_save: ${{ github.ref == 'refs/heads/main' }}
        # A hit still resolves each `latest` and downloads any newer release
        # (pixtuoid/pixtuoid#2193), so a daily rebuild keeps those downloads
        # to a day's releases.
        cache_max_age_days: 1
