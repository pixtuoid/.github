# yaml-language-server: $schema=https://json.schemastore.org/zizmor.json

# The org's one policy: a repo's exception is an inline
# `# zizmor: ignore[<audit>]` with its why.
rules:
  # actionlint 1.7.12 rejects `$/`, the form this audit asks for; it returns
  # once rhysd/actionlint#711 ships.
  self-repository:
    disable: true
  unpinned-uses:
    config:
      # Every other action is hash-pinned, zizmor's default
      # (docs.zizmor.sh/audits/#unpinned-uses).
      policies:
        # They run at `@main`, which changes only through a PR
        # (https://github.com/pixtuoid/.github/rules/24918053).
        pixtuoid/.github/*: ref-pin
