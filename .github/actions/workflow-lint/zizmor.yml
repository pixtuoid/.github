# yaml-language-server: $schema=https://json.schemastore.org/zizmor.json

# The org's one policy: a repo-specific exception is an inline
# `# zizmor: ignore[<audit>]` with its why, on the line it covers.
rules:
  # actionlint checks a local action's inputs only at `./` and rejects `$/`
  # (rhysd/actionlint#711, observed on 1.7.12), the form this audit asks for.
  self-repository:
    disable: true
  unpinned-uses:
    config:
      # Every other action is hash-pinned, zizmor's default since v1.20.0: "a
      # tag can be moved or deleted if a bad actor gains access to the
      # repository storing the action" (GitHub's secure-use reference).
      policies:
        # The org's shared workflows and actions run at `@main`, which changes
        # only through a PR (https://github.com/pixtuoid/.github/rules/24918053).
        pixtuoid/.github/*: ref-pin
