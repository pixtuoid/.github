name: 'Workflow lint'
description: "Lints the caller's workflows, composite actions and dependabot.yml: zizmor under the org's policy, actionlint with shellcheck over the workflows' run: blocks, and shellcheck over each run: block of .github/actions/* but a PowerShell, Python or cmd one"

runs:
  using: 'composite'
  steps:
    # The pin names each tool's version, so a Dependabot bump moves both (the
    # action's README). actionlint isn't among its tools (TOOLS.md); `go run`
    # below is checked by the Go checksum database (go.dev/ref/mod#checksum-database).
    - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
      with:
        tool: zizmor,shellcheck
    - name: zizmor
      shell: bash
      env:
        # Tokenless, zizmor skips its online audits (docs.zizmor.sh/usage/#operating-modes).
        GH_TOKEN: ${{ github.token }}
        CONFIG: ${{ github.action_path }}/zizmor.yml
      # The root, so dependabot.yml is audited too.
      run: zizmor --config "$CONFIG" --strict-collection .
    - name: actionlint
      shell: bash
      # Its shellcheck is the one above. Dependabot never bumps a `go run`
      # argument (docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot),
      # so this moves by hand.
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
    - name: shellcheck composite actions
      shell: bash
      # actionlint rejects action.yml. A `${{ }}` the shell would expand fails,
      # keeping expressions in `env:` (GitHub's secure-use reference).
      run: |
        set -euo pipefail
        shopt -s nullglob
        work="$(mktemp -d)"
        trap 'rm -rf "$work"' EXIT
        status=0
        checked=0
        for action in .github/actions/*/action.y*ml; do # GitHub accepts action.yaml too
          count="$(yq '[.runs.steps[] | select(has("run"))] | length' "$action")"
          for ((i = 0; i < count; i++)); do
            step=".runs.steps | map(select(has(\"run\"))) | .[$i]"
            # A custom shell (`/bin/bash -e {0}`) is its command's dialect
            # (docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax,
            # "Custom shell"). GitHub's other built-in shells are no Bourne
            # dialect, and shellcheck refuses any other one out loud.
            shell="$(yq -r "$step.shell" "$action")"
            shell="${shell%% *}"
            shell="${shell##*/}"
            case "$shell" in pwsh | powershell | python | cmd) continue ;; esac
            script="$work/$checked.$shell"
            { echo "#!/usr/bin/env $shell"; yq -r "$step.run" "$action"; } >"$script"
            if ! shellcheck -s "$shell" "$script"; then
              echo "::error file=$action::shellcheck: its run step $i"
              status=1
            fi
            checked=$((checked + 1))
          done
        done
        echo "$checked composite run: blocks shellchecked"
        exit "$status"
