name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The workflows and actions here run in every org repo that calls them, so
  # their lint and tests gate this repo's merges.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/org-rules
      - uses: ./.github/actions/workflow-lint
      # After workflow-lint, whose tools its test runs.
      - run: |
          set -euo pipefail
          for test in .github/actions/*/test.sh .github/scripts/*-test.sh; do
            echo "::group::$test"
            bash "$test"
            echo "::endgroup::"
          done

  # The org's queue requires it (.mergify.yml). `always()`, not `!cancelled()`:
  # "A job that is skipped will report its status as 'Success'"
  # (docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions).
  ci-gate:
    if: ${{ always() }}
    needs: [workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # main's, so a PR that breaks the gate is never judged by its own copy.
      - uses: pixtuoid/.github/.github/actions/require-jobs@main
        with:
          results: ${{ toJSON(needs) }}
          label: ci-gate
