name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The workflows and actions here run in every org repo that calls them, so
  # their lint and tests gate this repo's merges.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: zizmor@1.30.0
      # The repo root, not just workflows/, so dependabot.yml is audited too.
      - run: zizmor --config .github/zizmor.yml .
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - run: bash .github/actions/setup-rust/test.sh
