name: claude-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions: {}
jobs:
  claude-review:
    uses: pixtuoid/.github/.github/workflows/claude-review.yml@ci/review-scope-from-every-page
    permissions:
      contents: read
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
